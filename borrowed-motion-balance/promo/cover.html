<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SwapStep cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
  /* 스토어 표지: 제목 외 글자 금지·테두리/아이콘 금지(CrazyGames 규정). ?layout=landscape|portrait|square */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    --u: 1vmin;
    background:
      radial-gradient(60% 55% at 18% 22%, rgba(232,116,59,.20), transparent 70%),
      radial-gradient(55% 55% at 85% 85%, rgba(47,143,131,.20), transparent 70%),
      radial-gradient(40% 40% at 90% 12%, rgba(123,108,217,.14), transparent 70%),
      radial-gradient(120% 120% at 50% 0%, #fdf6e7 0%, #f3e4c9 70%, #ecd9b8 100%);
    font-family: 'Fredoka', system-ui, sans-serif;
    display: grid; place-items: center; position: relative;
  }
  .stage { position: relative; display: flex; align-items: center; justify-content: center; }
  body.landscape .stage { flex-direction: row; gap: calc(var(--u) * 7); }
  body.portrait .stage, body.square .stage { flex-direction: column; }
  body.portrait .stage { gap: calc(var(--u) * 11); }
  body.square .stage { gap: calc(var(--u) * 7); }

  /* title */
  .title {
    font-weight: 700; line-height: .9; letter-spacing: -.01em; text-align: center;
    paint-order: stroke fill; -webkit-text-stroke: calc(var(--u) * 1.6) #fffaf0;
    filter: drop-shadow(0 calc(var(--u) * .9) 0 rgba(122,82,40,.28)) drop-shadow(0 calc(var(--u) * 2.2) calc(var(--u) * 2.4) rgba(122,82,40,.22));
  }
  .title .a { color: #e8743b; display: block; }
  .title .b { color: #2f8f83; display: block; }
  body.landscape .title { font-size: calc(var(--u) * 19); text-align: left; }
  body.landscape .title .b { margin-left: calc(var(--u) * 7); }
  body.portrait .title { font-size: calc(var(--u) * 20); }
  body.portrait .title .a, body.portrait .title .b { display: inline; }
  body.square .title { font-size: calc(var(--u) * 15); }
  body.square .title .a, body.square .title .b { display: inline; }

  /* board */
  .board {
    --B: calc(var(--u) * 62);
    width: var(--B); height: var(--B); position: relative; border-radius: calc(var(--B) * .07);
    background: #fffaf0; padding: calc(var(--B) * .035);
    box-shadow: 0 calc(var(--u) * 2.6) calc(var(--u) * 6) rgba(110,78,40,.28), inset 0 0 0 calc(var(--u) * .35) rgba(229,216,191,.9);
    transform: rotate(-5deg);
  }
  body.portrait .board { --B: calc(var(--u) * 76); transform: rotate(-4deg); }
  body.square .board { --B: calc(var(--u) * 57); transform: rotate(-4deg); }
  .grid { position: absolute; inset: calc(var(--B) * .035); display: grid; grid-template: repeat(4, 1fr) / repeat(4, 1fr); gap: calc(var(--B) * .022); }
  .cell { background: #f6efe0; border: calc(var(--u) * .2) solid #e8dcc4; border-radius: calc(var(--B) * .04); }
  .cell.wall {
    background: repeating-linear-gradient(45deg, #b9ad97 0 calc(var(--B) * .018), #d6ccb8 calc(var(--B) * .018) calc(var(--B) * .036));
    border-color: #a99d86; box-shadow: inset 0 calc(var(--u) * .5) calc(var(--u) * 1) rgba(0,0,0,.18);
  }
  .layer { position: absolute; inset: calc(var(--B) * .035); }
  .tok { position: absolute; width: 21.5%; height: 21.5%; transform: translate(-50%, -50%); display: grid; place-items: center; }
  .target { border: calc(var(--u) * .55) dashed var(--c); border-radius: calc(var(--B) * .045); background: color-mix(in srgb, var(--c) 10%, transparent);
    color: color-mix(in srgb, var(--c) 60%, #a89573); font-weight: 700; font-size: calc(var(--B) * .085); }
  .target span { opacity: .55; }
  .piece { width: 18%; height: 18%; border-radius: calc(var(--B) * .05); color: #fff; font-weight: 700; font-size: calc(var(--B) * .09);
    background: radial-gradient(120% 120% at 30% 25%, color-mix(in srgb, var(--c) 78%, #fff) 0%, var(--c) 70%);
    box-shadow: 0 calc(var(--u) * 1.1) calc(var(--u) * 2.2) color-mix(in srgb, var(--c) 40%, transparent), inset 0 calc(var(--u) * -.5) calc(var(--u) * 1) rgba(0,0,0,.14); }
  .piece.sel { box-shadow: 0 0 0 calc(var(--u) * .7) #fff, 0 0 0 calc(var(--u) * 1.5) var(--c), 0 calc(var(--u) * 1.4) calc(var(--u) * 3) color-mix(in srgb, var(--c) 45%, transparent); }
  .piece .num { position: relative; z-index: 1; text-shadow: 0 calc(var(--u) * .25) calc(var(--u) * .4) rgba(0,0,0,.22); }
  .piece .arrow { position: absolute; inset: 0; }
  .piece .arrow::after { content: ""; position: absolute; right: 8%; top: 50%; width: 18%; height: 7%; background: #fff; border-radius: 9px; transform: translateY(-50%); }
  .piece .arrow::before { content: ""; position: absolute; right: 5%; top: 50%; transform: translateY(-50%);
    border-top: calc(var(--B) * .016) solid transparent; border-bottom: calc(var(--B) * .016) solid transparent; border-left: calc(var(--B) * .022) solid #fff; }
  .ghost { width: 18%; height: 18%; border-radius: calc(var(--B) * .05); border: calc(var(--u) * .5) dashed var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); opacity: .9; }
  svg.swap { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* sparkles */
  .spark { position: absolute; width: calc(var(--u) * var(--s)); height: calc(var(--u) * var(--s)); background: var(--c);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: .85; }
  .dot { position: absolute; width: calc(var(--u) * var(--s)); height: calc(var(--u) * var(--s)); border-radius: 50%; background: var(--c); opacity: .35; }
</style>
</head>
<body>
<div class="stage">
  <h1 class="title"><span class="a">Swap</span><span class="b">Step</span></h1>
  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="layer" id="layer"></div>
  </div>
</div>
<div id="deco"></div>
<script>
  const layout = new URLSearchParams(location.search).get('layout') || 'landscape';
  document.body.className = layout;
  const C = { o: '#e8743b', t: '#2f8f83', p: '#7b6cd9', k: '#c0497b' };
  const WALL = [1, 2];
  const grid = document.getElementById('grid');
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const c = document.createElement('div'); c.className = 'cell' + (x === WALL[0] && y === WALL[1] ? ' wall' : ''); grid.appendChild(c);
  }
  const layer = document.getElementById('layer');
  const pos = v => (v * 25 + 12.5) + '%';
  const add = (cls, x, y, c, html, rot) => {
    const e = document.createElement('div'); e.className = 'tok ' + cls; e.style.left = pos(x); e.style.top = pos(y); e.style.setProperty('--c', c);
    e.innerHTML = html || ''; if (rot != null) e.querySelector('.arrow').style.transform = `rotate(${rot}deg)`; layer.appendChild(e); return e;
  };
  // 목표 칸(점선)
  add('target', 0, 0, C.o, '<span>1</span>');
  add('target', 3, 3, C.t, '<span>2</span>');
  add('target', 3, 0, C.p, '<span>3</span>');
  // 이동 미리보기(점선 유령): 방향을 맞바꾼 두 조각이 갈 곳
  add('ghost', 1, 0, C.o);
  add('ghost', 2, 2, C.t);
  // 조각: 1·2가 선택되어 서로 화살표를 바꾸는 순간, 3은 대기
  add('piece sel', 1, 1, C.o, '<span class="arrow"></span><span class="num">1</span>', -90);
  add('piece sel', 2, 1, C.t, '<span class="arrow"></span><span class="num">2</span>', 90);
  add('piece', 2, 3, C.p, '<span class="arrow"></span><span class="num">3</span>', 0);
  // 두 조각 사이 "방향 교환" 곡선 화살표
  layer.insertAdjacentHTML('beforeend', `
    <svg class="swap" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><marker id="h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#f5b53d"/></marker></defs>
      <path d="M31,26 C38,12 50,12 56,24" fill="none" stroke="#f5b53d" stroke-width="1.6" stroke-dasharray="3 2.2" stroke-linecap="round" marker-start="url(#h)" marker-end="url(#h)"/>
    </svg>`);
  // 장식: 반짝이·점 (배치 고정 — 매번 같은 결과)
  const deco = document.getElementById('deco');
  const S = [
    [6, 10, 3.2, '#f5c518'], [92, 18, 2.4, '#f5c518'], [12, 84, 2.6, '#e8743b'], [88, 78, 3.4, '#f5c518'],
    [48, 6, 2, '#2f8f83'], [70, 92, 2.2, '#7b6cd9'], [30, 94, 1.8, '#f5c518'], [96, 50, 2, '#c0497b'],
  ];
  S.forEach(([x, y, s, c]) => deco.insertAdjacentHTML('beforeend', `<div class="spark" style="left:${x}%;top:${y}%;--s:${s};--c:${c}"></div>`));
  [[20, 8, 1.4, '#e8743b'], [80, 6, 1.1, '#2f8f83'], [4, 50, 1.2, '#7b6cd9'], [60, 96, 1.3, '#e8743b'], [94, 34, 1, '#2f8f83']]
    .forEach(([x, y, s, c]) => deco.insertAdjacentHTML('beforeend', `<div class="dot" style="left:${x}%;top:${y}%;--s:${s};--c:${c}"></div>`));
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
