<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SwapStep app icon</title>
<style>
  /* 앱 아이콘: 해·달 조각 두 개 + 맞바꾸는 곡선 화살표. ?mode=full(배경 포함, 스토어·옛 런처용) | fg(투명 배경, 적응형 아이콘 전경) */
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body.full { background: radial-gradient(120% 120% at 30% 15%, #fdf6e7 0%, #f3e4c9 65%, #ead6b2 100%); }
  .art { position: absolute; inset: 0; }
  body.fg .art { inset: 18%; }               /* 적응형 아이콘: 가운데 안전 영역(약 64%) 안에만 그린다 */
  body.full .art { inset: 8%; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
</style>
</head>
<body>
<div class="art">
<svg viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <marker id="h" viewBox="0 0 10 10" refX="5.5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a93b"/></marker>
  </defs>
  <!-- 맞바꾸는 곡선 화살표 -->
  <path d="M27 30 C33 8 67 8 73 30" fill="none" stroke="#f2a93b" stroke-width="5.2" stroke-linecap="round" marker-start="url(#h)" marker-end="url(#h)"/>
  <!-- 주황 조각(해, 위 화살표) -->
  <g transform="translate(4 40)">
    <rect x="0" y="4" width="44" height="44" rx="11" fill="#b85a26"/>
    <rect x="0" y="0" width="44" height="44" rx="11" fill="#e8743b"/>
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#hl)"/>
    <g transform="translate(22 28) scale(.62) translate(-12 -12)" fill="#fff" stroke="#fff">
      <circle cx="12" cy="12" r="4.8" stroke="none"/>
      <path d="M18.6 12L21.4 12M16.7 16.7L18.6 18.6M12 18.6L12 21.4M7.3 16.7L5.4 18.6M5.4 12L2.6 12M7.3 7.3L5.4 5.4M12 5.4L12 2.6M16.7 7.3L18.6 5.4" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M22 14V5M16.5 9.5 22 4 27.5 9.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 초록 조각(달, 아래 화살표) -->
  <g transform="translate(52 40)">
    <rect x="0" y="4" width="44" height="44" rx="11" fill="#1f655c"/>
    <rect x="0" y="0" width="44" height="44" rx="11" fill="#2f8f83"/>
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#hl)"/>
    <g transform="translate(22 16) scale(.62) translate(-12 -12)" fill="#fff">
      <path d="M15.4 3.6a8.6 8.6 0 1 0 5 13.4 7 7 0 0 1-5-13.4z"/>
    </g>
    <path d="M22 30V39M16.5 34.5 22 40 27.5 34.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
<script>document.body.className = new URLSearchParams(location.search).get('mode') || 'full';</script>
</body>
</html>
