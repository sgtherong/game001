<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3ead9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스왑스텝">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>스왑스텝</title>
<style>
  :root {
    --bg: #f3ead9;
    --card: #fffaf0;
    --ink: #3a3226;
    --muted: #8a7f6d;
    --line: #e5d8bf;
    --cell: #f6efe0;
    --cell-line: #e8dcc4;
    --accent: #d98b4a;
    --shadow: 0 10px 30px rgba(90, 70, 40, .12);
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(120% 120% at 50% 0%, #f8f1e2 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }
  .app {
    max-width: 480px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; padding: 14px 16px 22px;
  }

  /* header */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  header .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  header .brand small { display:block; font-weight:600; font-size:11px; color:var(--muted); letter-spacing:0; }
  header .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    width: 42px; height: 42px; border-radius: 12px; font-size: 18px;
    display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow);
  }
  .icon-btn:active { transform: translateY(1px); }

  /* progress */
  .progress { margin: 8px 0 12px; }
  .progress .track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress .bar { height: 100%; width: 0; background: linear-gradient(90deg,#e8a45c,#d98b4a); border-radius: 99px; transition: width .4s; }
  .progress .lbl { font-size: 11px; color: var(--muted); margin-top: 5px; text-align: right; }

  /* stage meta */
  .meta { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .meta .title { font-weight: 700; font-size: 15px; }
  .meta .chapter {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--accent);
    padding: 3px 9px; border-radius: 99px;
  }

  /* board */
  .board-wrap { position: relative; }
  #board {
    --n: 3;
    position: relative;
    width: 100%; aspect-ratio: 1/1;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 10px;
    touch-action: manipulation;
  }
  #board.previewing { box-shadow: 0 0 0 2px rgba(217,139,74,.35), var(--shadow); }
  #grid {
    position: absolute; inset: 10px;
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    grid-template-rows: repeat(var(--n), 1fr);
    gap: 8px;
  }
  .cell { background: var(--cell); border: 1px solid var(--cell-line); border-radius: 12px; }
  #layer { position: absolute; inset: 10px; }

  /* tokens: JS sets left/top/width/height/font-size in px against #layer */
  .target, .piece, .pv-ghost {
    position: absolute;
    transform: translate(-50%, -50%);
    display: grid; place-items: center;
    box-sizing: border-box;
  }
  .target, .pv-ghost { pointer-events: none; }

  .target {
    --c: #888;
    border: 2px dashed color-mix(in srgb, var(--c) 55%, #cbb58f);
    border-radius: 14px;
    background: color-mix(in srgb, var(--c) 8%, transparent);
    color: color-mix(in srgb, var(--c) 70%, #9a8b6f);
    font-weight: 800; opacity: .9;
  }
  .target span { opacity: .55; }

  .piece {
    --c: #e8743b;
    border: none;
    background: radial-gradient(120% 120% at 30% 25%, color-mix(in srgb, var(--c) 78%, #fff) 0%, var(--c) 70%);
    border-radius: 16px;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--c) 35%, transparent), inset 0 -3px 6px rgba(0,0,0,.12);
    color: #fff; cursor: pointer;
    transition: left .3s cubic-bezier(.2,.8,.3,1), top .3s cubic-bezier(.2,.8,.3,1), box-shadow .2s;
  }
  .piece .num { font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.2); pointer-events: none; }
  .piece .arrow {
    position: absolute; inset: 0; pointer-events: none;
    transition: transform .28s cubic-bezier(.2,.8,.3,1);
  }
  .piece .arrow::after {
    content: ""; position: absolute; right: 8%; top: 50%;
    width: 18%; height: 3px; background: #fff; border-radius: 3px;
    transform: translateY(-50%);
  }
  .piece .arrow::before {
    content: ""; position: absolute; right: 6%; top: 50%;
    width: 0; height: 0; transform: translateY(-50%);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 7px solid #fff;
  }
  .piece.selected { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--c), 0 8px 18px color-mix(in srgb, var(--c) 45%, transparent); z-index: 5; }
  .piece.on-target { outline: 2px solid rgba(255,255,255,.7); outline-offset: -6px; }
  .piece .stop {
    position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 700; color: #fff; background: #b4524a;
    padding: 1px 7px; border-radius: 99px; white-space: nowrap; display: none;
    box-shadow: 0 3px 6px rgba(0,0,0,.2); z-index: 6;
  }
  .piece.will-stop .stop { display: block; }

  .pv-ghost {
    --c: #888;
    border: 2px dashed var(--c);
    background: color-mix(in srgb, var(--c) 16%, transparent);
    color: var(--c); font-weight: 800;
    border-radius: 16px; opacity: 0; transition: opacity .15s;
  }
  .pv-ghost.show { opacity: .85; }

  /* hint text */
  .hint { min-height: 34px; margin: 12px 2px 6px; font-size: 13px; line-height: 1.4; color: var(--muted); text-align: center; }

  /* action buttons */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .actions .row { display: flex; gap: 10px; }
  button.btn {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 13px 10px; border-radius: 14px; font-size: 14px; font-weight: 700;
    cursor: pointer; box-shadow: var(--shadow); transition: transform .1s, opacity .2s;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  button.btn.primary { background: linear-gradient(180deg,#e79a52,#d98b4a); color: #fff; border-color: transparent; }
  button.btn.ghost { background: transparent; box-shadow: none; }

  /* overlay result */
  .overlay {
    position: fixed; inset: 0; background: rgba(58,50,38,.4);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 40;
    backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .result {
    background: var(--card); border-radius: 22px; padding: 26px 22px; width: 100%; max-width: 340px;
    text-align: center; box-shadow: 0 20px 50px rgba(60,45,25,.3); animation: pop .3s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .result .badge { font-size: 42px; margin-bottom: 6px; }
  .result .badge.star { font-size: 54px; line-height: 1; }
  .result .badge.star.gold { color: #f5c518; text-shadow: 0 2px 8px rgba(245,197,24,.4); }
  .result .badge.star.gray { color: #c9c0ad; }
  .result-title { font-size: 22px; font-weight: 800; margin: 2px 0 6px; }
  .result-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .result .btns { display: flex; gap: 10px; }

  /* drawer / stage list */
  .drawer { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
  .drawer.open { visibility: visible; }
  .drawer .backdrop { position: absolute; inset: 0; background: rgba(58,50,38,.4); opacity: 0; transition: opacity .25s; }
  .drawer.open .backdrop { opacity: 1; }
  .drawer .panel {
    position: absolute; top: 0; right: 0; height: 100%; width: min(88%, 380px);
    background: var(--card); box-shadow: -10px 0 40px rgba(60,45,25,.25);
    transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.3,1);
    display: flex; flex-direction: column; padding: 16px;
  }
  .drawer.open .panel { transform: none; }
  .drawer .panel h2 { font-size: 16px; margin: 4px 4px 12px; display:flex; align-items:center; }
  .drawer .panel h2 .spacer { flex:1; }
  .stage-list { overflow-y: auto; padding: 4px; display: flex; flex-direction: column; }
  /* collapsible chapter sections */
  .chapter { border: 1px solid var(--line); border-radius: 12px; margin: 5px 2px; overflow: hidden; background: var(--card); }
  /* keep each world at its natural height — otherwise a short (mobile) viewport
     compresses these flex items instead of scrolling the list, squashing them to a sliver */
  .stage-list > .chapter { flex: 0 0 auto; }
  .chapter-head {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    padding: 12px 12px; font-size: 13px; font-weight: 800; color: var(--ink);
    background: color-mix(in srgb, var(--accent) 7%, var(--card));
  }
  .chapter-head::-webkit-details-marker { display: none; }
  .chapter-head .cv {
    width: 8px; height: 8px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    transform: rotate(-45deg); transition: transform .2s; flex: none; margin: 0 2px;
  }
  .chapter[open] > .chapter-head .cv { transform: rotate(45deg); }
  .chapter-head .nm { flex: 1; }
  .chapter-head .cnt { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage-chip {
    position: relative; display: inline-grid; place-items: center;
    width: 42px; height: 42px; margin: 3px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--cell); color: var(--ink);
    font-weight: 700; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .stage-chip .sc-num { line-height: 1; }
  .stage-chip.done { background: linear-gradient(180deg,#7cc0a8,#5aa88c); color: #fff; border-color: transparent; }
  .stage-chip.current { outline: 3px solid var(--accent); outline-offset: 1px; }
  .stage-chip .sc-star { position: absolute; bottom: -3px; right: 1px; font-size: 12px; line-height: 1; color: #cfd8d3; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
  .stage-chip .sc-star.gold { color: #ffd23f; }
  .stage-chip .sc-lock { position: absolute; top: 1px; right: 2px; font-size: 9px; }
  .stage-chip.locked { opacity: .55; cursor: default; }
  .stage-chip.locked .sc-num { opacity: .5; }
  .chips { display: flex; flex-wrap: wrap; padding: 6px 6px 10px; }

  .foot { text-align:center; font-size: 11px; color: var(--muted); margin-top: 14px; line-height:1.5; }

  /* confetti */
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .3s; }

  /* win flash */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 65; }
  #flash.go { animation: flashGo .5s ease-out; }
  @keyframes flashGo { 0% { opacity: 0 } 12% { opacity: .5 } 100% { opacity: 0 } }

  /* target lock-in ring pulse when a piece arrives */
  .target.lit { animation: targetLock .6s ease-out; }
  @keyframes targetLock {
    0%   { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 75%, transparent); border-color: var(--c); }
    100% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--c) 0%, transparent); }
  }
  /* piece glow when it lands on its target */
  .piece.arrived { animation: arrivePop .5s ease; }
  @keyframes arrivePop { 0% { filter: brightness(1); } 30% { filter: brightness(1.55) saturate(1.2); } 100% { filter: brightness(1); } }
  /* victory bounce (keeps the translate(-50%,-50%) centering base) */
  .piece.win-bounce { animation: winBounce .6s ease; }
  @keyframes winBounce {
    0%   { transform: translate(-50%, -50%) scale(1); }
    30%  { transform: translate(-50%, -64%) scale(1.08); }
    55%  { transform: translate(-50%, -50%) scale(1); }
    75%  { transform: translate(-50%, -56%) scale(1.03); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    #flash.go, .target.lit, .piece.arrived, .piece.win-bounce { animation: none; }
  }

  /* generic centered overlay card (tutorial / album / sticker) */
  .modal { position: fixed; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; padding: 22px; }
  .modal.show { display: flex; animation: fade .2s; }
  .modal .backdrop { position: absolute; inset: 0; background: rgba(58,50,38,.42); backdrop-filter: blur(2px); }
  .modal .sheet {
    position: relative; background: var(--card); border-radius: 22px; padding: 24px 22px;
    width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(60,45,25,.3);
    animation: pop .3s cubic-bezier(.2,1.2,.4,1); text-align: center;
  }
  .modal h3 { font-size: 20px; font-weight: 800; margin: 2px 0 14px; }

  /* tutorial visual demo (language-independent) */
  .tut-demo { margin: 6px 0 14px; }
  .td-board { position: relative; width: 236px; height: 62px; margin: 0 auto; background: var(--cell); border: 1px solid var(--line); border-radius: 12px; }
  .td-cell { position: absolute; top: 6px; width: 50px; height: 50px; border-radius: 9px; background: color-mix(in srgb, var(--ink) 5%, var(--card)); }
  .td-target { position: absolute; top: 6px; width: 50px; height: 50px; border-radius: 9px; border: 2px dashed; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .td-target.t1 { left: 6px; color: #e8743b; border-color: #e8743b; } .td-target.t1 span { opacity: .5; }
  .td-target.t2 { left: 180px; color: #2f8f83; border-color: #2f8f83; } .td-target.t2 span { opacity: .5; }
  .td-target.lit { animation: tdLit 5s ease-out infinite; }
  @keyframes tdLit { 0%,58% { box-shadow: 0 0 0 0 transparent; } 68% { box-shadow: 0 0 0 7px color-mix(in srgb, currentColor 32%, transparent); } 82%,100% { box-shadow: 0 0 0 11px transparent; } }
  .td-piece { position: absolute; top: 10px; width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 4px 8px rgba(0,0,0,.2); }
  .td-piece .td-num { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .td-piece .td-arrow { position: absolute; inset: 0; }
  .td-piece .td-arrow::after { content: ""; position: absolute; right: 7%; top: 50%; width: 16%; height: 3px; background: #fff; transform: translateY(-50%); border-radius: 3px; }
  .td-piece .td-arrow::before { content: ""; position: absolute; right: 5%; top: 50%; width: 0; height: 0; transform: translateY(-50%); border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 6px solid #fff; }
  .td-piece.p1 { background: #e8743b; }
  .td-piece.p2 { background: #2f8f83; }
  .td-piece.p1 { animation: tdP1 5s ease-in-out infinite; }
  .td-piece.p2 { animation: tdP2 5s ease-in-out infinite; }
  .td-piece.p1 .td-arrow { animation: tdA1 5s ease-in-out infinite; }
  .td-piece.p2 .td-arrow { animation: tdA2 5s ease-in-out infinite; }
  .td-finger { position: absolute; font-size: 26px; left: 78px; top: 44px; animation: tdFinger 5s ease-in-out infinite; }
  /* p1: cell1(89) -> cell0(31 center => left 68? use left of element) ; element left = center-21 */
  @keyframes tdP1 { 0%,44% { left: 68px; } 60%,86% { left: 10px; } 92% { opacity: 1; } 96% { opacity: 0; left: 10px; } 100% { opacity: 1; left: 68px; } }
  @keyframes tdP2 { 0%,44% { left: 126px; } 60%,86% { left: 184px; } 92% { opacity: 1; } 96% { opacity: 0; left: 184px; } 100% { opacity: 1; left: 126px; } }
  @keyframes tdA1 { 0%,30% { transform: rotate(0deg); } 42%,100% { transform: rotate(180deg); } } /* → becomes ← */
  @keyframes tdA2 { 0%,30% { transform: rotate(180deg); } 42%,100% { transform: rotate(360deg); } } /* ← becomes → */
  @keyframes tdFinger {
    0% { left: 120px; top: 60px; opacity: 0; }
    6% { opacity: 1; } 12% { left: 78px; top: 44px; } 16% { top: 40px; } 20% { top: 44px; }
    26% { left: 136px; top: 44px; } 30% { top: 40px; } 34% { top: 44px; }
    44% { opacity: 1; } 50% { opacity: 0; top: 60px; } 100% { opacity: 0; }
  }
  .tut-demo-cap { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .td-piece.p1, .td-piece.p2, .td-piece .td-arrow, .td-finger, .td-target.lit { animation: none; }
    .td-piece.p1 { left: 10px; } .td-piece.p2 { left: 184px; } .td-finger { display: none; }
  }

  /* language selector */
  .lang-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .lang-lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
  #langSelect { flex: 1; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; }

  /* tutorial */
  .tut-step { display: flex; gap: 12px; align-items: center; text-align: left; margin: 12px 2px; }
  .tut-step .ic {
    flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 22px; background: var(--cell); border: 1px solid var(--line);
  }
  .tut-step .tx { font-size: 13.5px; line-height: 1.45; color: var(--ink); }
  .tut-step .tx b { color: var(--accent); }

  /* album */
  .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 6px 0 14px; }
  .sticker {
    aspect-ratio: 1/1; border-radius: 16px; display: flex; flex-direction: column; gap: 4px;
    align-items: center; justify-content: center; border: 2px dashed var(--line); background: var(--cell);
    color: var(--muted);
  }
  .sticker .emoji { font-size: 30px; opacity: .35; }
  .sticker .nm { font-size: 10px; font-weight: 700; }
  .sticker.got {
    border: none; background: radial-gradient(120% 120% at 30% 20%, #fff6e8, #f3e2c4);
    color: var(--ink); box-shadow: 0 6px 14px rgba(180,140,80,.25); animation: pop .4s cubic-bezier(.2,1.2,.4,1);
  }
  .sticker.got .emoji { opacity: 1; }
  .album-status { font-size: 12px; color: var(--muted); margin-bottom: 16px; }

  /* sticker reward */
  .sticker-big { font-size: 76px; animation: pop .5s cubic-bezier(.2,1.4,.4,1); margin-bottom: 6px; }

  /* daily challenge */
  .daily-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .daily-date { font-size: 12px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .daily-streak { font-size: 13px; color: var(--accent); font-weight: 800; }
  .daily-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .daily-card {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: var(--cell); color: var(--ink);
    border-radius: 14px; padding: 14px; cursor: pointer;
  }
  .daily-card .dc-lv { font-size: 15px; font-weight: 800; }
  .daily-card .dc-meta { flex: 1; font-size: 11px; color: var(--muted); font-weight: 600; }
  .daily-card .dc-go { font-size: 18px; font-weight: 800; color: var(--accent); }
  .daily-card.done { background: color-mix(in srgb, #5aa88c 14%, var(--cell)); border-color: color-mix(in srgb, #5aa88c 45%, var(--line)); }
  .daily-card.done .dc-go { color: #5aa88c; }

  /* weekly reward tracker */
  .weekly { margin: 4px 0 14px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--cell); }
  .weekly-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .weekly-title { font-size: 14px; font-weight: 800; }
  .weekly-count { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .weekly-dots { display: flex; gap: 6px; margin-bottom: 12px; }
  .weekly-dots .wk-dot { flex: 1; height: 8px; border-radius: 5px; background: var(--line); transition: background .2s; }
  .weekly-dots .wk-dot.on { background: var(--accent); }
  .weekly-rewards { display: flex; gap: 8px; }
  .wk-reward {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--fg); cursor: default; font: inherit;
  }
  .wk-reward .wk-goal { font-size: 11px; font-weight: 700; color: var(--muted); }
  .wk-reward .wk-prize { font-size: 14px; font-weight: 800; }
  .wk-reward .wk-state { font-size: 12px; font-weight: 700; color: var(--muted); }
  .wk-reward.ready {
    cursor: pointer; border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--bg));
    animation: wkPulse 1.6s ease-in-out infinite;
  }
  .wk-reward.ready .wk-state { color: var(--accent); }
  .wk-reward.claimed { background: color-mix(in srgb, #5aa88c 14%, var(--cell)); border-color: color-mix(in srgb, #5aa88c 45%, var(--line)); }
  .wk-reward.claimed .wk-state { color: #5aa88c; }
  @keyframes wkPulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }

  /* sound toggle in drawer */
  .sound-toggle {
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line);
  }
  #btnSound, #btnBackup {
    width: 100%; border: 1px solid var(--line); background: var(--cell); color: var(--ink);
    padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #btnBackup { margin-top: 8px; }
  #btnSound.off { color: var(--muted); }
  /* world theme flavor in the picker header */
  .chapter-head .nm em { font-style: normal; color: var(--muted); font-weight: 600; font-size: 11px; }
  /* backup modal */
  .backup-sheet { text-align: left; }
  .backup-sheet h3 { text-align: center; }
  .bk-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 4px 2px 6px; }
  .bk-area {
    width: 100%; box-sizing: border-box; resize: none; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--cell); color: var(--ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px;
    padding: 8px; line-height: 1.4; word-break: break-all;
  }
  .bk-status { font-size: 12px; font-weight: 700; color: var(--accent); text-align: center; min-height: 16px; margin-top: 8px; }

  /* store */
  .store-sheet { text-align: left; }
  .store-sheet h3 { text-align: center; }
  .store-status { font-size: 12.5px; font-weight: 700; color: var(--accent); text-align: center; margin-bottom: 10px; }
  .store-note { font-size: 12px; color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); padding: 8px 10px; border-radius: 10px; margin-bottom: 12px; text-align: center; }
  .prod { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; background: var(--cell); }
  .prod.owned { text-align: center; }
  .prod-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .prod-name { font-size: 16px; font-weight: 800; }
  .prod-price { font-size: 18px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .prod-feat { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .prod-feat li { font-size: 13px; color: var(--ink); padding-left: 20px; position: relative; }
  .prod-feat li::before { content: "✓"; position: absolute; left: 0; color: var(--accent); font-weight: 800; }
  .proto-tag { font-size: 10.5px; color: var(--muted); text-align: center; margin-top: 8px; }
  .store-sub { font-size: 12px; color: var(--muted); }
  .theme-row { margin: 6px 0 4px; }
  .theme-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .theme-opts { display: flex; gap: 8px; }
  .theme-opt { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--cell); color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; }
  .theme-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
  .store-legal { font-size: 10.5px; color: var(--muted); line-height: 1.5; margin-top: 12px; text-align: center; }

  /* rewarded ad placeholder */
  .ad-slot { position: relative; border: 2px dashed var(--line); border-radius: 14px; background: var(--cell); height: 150px; display: grid; place-items: center; margin-bottom: 14px; overflow: hidden; }
  .ad-badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; color: #fff; background: #8a7f6d; padding: 2px 8px; border-radius: 6px; }
  .ad-ph { text-align: center; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.6; }
  .ad-ph small { font-weight: 600; font-size: 11px; }

  /* theme pack: Mint (world-1 reward, free) — light cool palette */
  :root[data-pack="mint"] {
    --bg: #e4f3ef; --card: #ffffff; --ink: #1f4039; --muted: #6c8f88;
    --line: #cbe6df; --cell: #eef8f5; --cell-line: #d6ece6; --accent: #2f9e8f;
    --shadow: 0 10px 30px rgba(30,80,70,.12);
  }
  :root[data-pack="mint"] body { background: radial-gradient(120% 120% at 50% 0%, #f1faf8 0%, var(--bg) 60%); }

  /* theme pack: Dusk (황혼, premium-exclusive) — dark palette */
  :root[data-pack="dusk"] {
    --bg: #241f38; --card: #322b4d; --ink: #f2ecff; --muted: #b3a9d6;
    --line: #4a4170; --cell: #2c2646; --cell-line: #433a63; --accent: #e8a45c;
    --shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  :root[data-pack="dusk"] body { background: radial-gradient(120% 120% at 50% 0%, #3a3160 0%, var(--bg) 60%); }
  :root[data-pack="dusk"] .sticker.got { background: radial-gradient(120% 120% at 30% 20%, #4a4170, #322b4d); color: var(--ink); }

  /* locked theme option */
  .theme-opt.locked { opacity: .5; }
  .theme-opt .lk { font-size: 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">스왑스텝<small>SwapStep</small></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnHelp" data-i18n-title="header_help" title="Rules">❔</button>
    <button class="icon-btn" id="btnDaily" data-i18n-title="header_daily" title="Daily">📅</button>
    <button class="icon-btn" id="btnAlbum" data-i18n-title="header_album" title="Travel album">📖</button>
    <button class="icon-btn" id="btnStore" data-i18n-title="header_store" title="Store">💎</button>
    <button class="icon-btn" id="btnStages" data-i18n-title="header_stages" title="Stages">☰</button>
  </header>

  <div class="progress">
    <div class="track"><div class="bar" id="progressBar"></div></div>
    <div class="lbl" id="progressText"></div>
  </div>

  <div class="meta">
    <span class="title" id="stageTitle"></span>
    <span class="chapter" id="chapter"></span>
    <div class="spacer" style="flex:1"></div>
  </div>

  <div class="board-wrap">
    <div id="board"><div id="grid"></div><div id="layer"></div></div>
  </div>

  <div class="hint" id="hintText"></div>

  <div class="actions">
    <div class="row">
      <button class="btn" id="btnCancel" data-i18n="btn_cancel" disabled>Cancel</button>
      <button class="btn primary" id="btnCommit" data-i18n="btn_move" disabled>Move ▶</button>
    </div>
    <div class="row">
      <button class="btn" id="btnUndo"></button>
    </div>
    <div class="row">
      <button class="btn ghost" id="btnRestart" data-i18n="restart">↺ Restart</button>
      <button class="btn ghost" id="btnHint">💡 Hint</button>
    </div>
  </div>

  <div class="foot">
    <span data-i18n="foot1"></span><br>
    <span data-i18n="foot2"></span>
  </div>
</div>

<!-- win overlay -->
<div class="overlay" id="overlay">
  <div class="result">
    <div class="badge">🎉</div>
    <div class="result-title">성공!</div>
    <div class="result-sub"></div>
    <div class="btns">
      <button class="btn ghost" id="btnReplay" data-i18n="win_replay">Replay</button>
      <button class="btn primary" id="btnNext" data-i18n="win_next">Next ▶</button>
    </div>
  </div>
</div>

<!-- stage drawer -->
<div class="drawer" id="drawer">
  <div class="backdrop" id="drawerBackdrop"></div>
  <div class="panel">
    <h2><span data-i18n="drawer_title">Stages</span> <span class="spacer"></span><button class="icon-btn" id="drawerClose">✕</button></h2>
    <div class="stage-list" id="stageList"></div>
    <div class="sound-toggle">
      <div class="lang-row"><span class="lang-lbl" data-i18n="lang_label">Language</span><select id="langSelect"></select></div>
      <button id="btnSound">🔊 Sound on</button>
      <button id="btnBackup" data-i18n="backup_open">Backup / Restore</button>
    </div>
  </div>
</div>

<!-- confetti + win flash -->
<canvas id="confetti"></canvas>
<div id="flash"></div>

<!-- tutorial / rules -->
<div class="modal" id="tutorial">
  <div class="backdrop"></div>
  <div class="sheet">
    <h3 data-i18n="tut_title">How to play</h3>

    <!-- visual demo (language-independent): tap two → arrows swap → each steps -->
    <div class="tut-demo">
      <div class="td-board">
        <div class="td-cell" style="left:6px"></div>
        <div class="td-cell" style="left:64px"></div>
        <div class="td-cell" style="left:122px"></div>
        <div class="td-cell" style="left:180px"></div>
        <div class="td-target t1 lit"><span>1</span></div>
        <div class="td-target t2 lit"><span>2</span></div>
        <div class="td-piece p1"><span class="td-arrow"></span><span class="td-num">1</span></div>
        <div class="td-piece p2"><span class="td-arrow"></span><span class="td-num">2</span></div>
        <div class="td-finger">👆</div>
      </div>
      <div class="tut-demo-cap" data-i18n="tut_demo_cap">Tap two → swap → each steps once</div>
    </div>

    <div class="tut-step"><div class="ic">🔀</div><div class="tx" data-i18n-html="tut_s1"></div></div>
    <div class="tut-step"><div class="ic">👣</div><div class="tx" data-i18n-html="tut_s2"></div></div>
    <div class="tut-step"><div class="ic">⛔</div><div class="tx" data-i18n-html="tut_s3"></div></div>
    <div class="tut-step"><div class="ic">🎯</div><div class="tx" data-i18n-html="tut_s4"></div></div>
    <button class="btn primary" id="tutorialStart" data-i18n="tut_start" style="width:100%;margin-top:8px;">Start</button>
  </div>
</div>

<!-- travel album -->
<div class="modal" id="albumOverlay">
  <div class="backdrop" id="albumBackdrop"></div>
  <div class="sheet">
    <h3 data-i18n="album_title">📖 Travel Album</h3>
    <div class="album-grid" id="albumGrid"></div>
    <div class="album-status" id="albumStatus"></div>
    <button class="btn" id="albumClose" data-i18n="album_close" style="width:100%;">Close</button>
  </div>
</div>

<!-- sticker reward -->
<div class="modal" id="stickerOverlay">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="sticker-big" id="stickerEmoji">🧭</div>
    <h3 id="stickerName"></h3>
    <div class="album-status" id="stickerSub"></div>
    <button class="btn primary" id="stickerOk" data-i18n="sticker_ok" style="width:100%;">View album</button>
  </div>
</div>

<!-- daily challenge -->
<div class="modal" id="daily">
  <div class="backdrop" id="dailyBackdrop"></div>
  <div class="sheet">
    <h3 data-i18n="daily_title">Daily Challenge</h3>
    <div class="daily-top">
      <span class="daily-date" id="dailyDate"></span>
      <span class="daily-streak" id="dailyStreak"></span>
    </div>
    <div class="daily-list" id="dailyList"></div>
    <div class="album-status" id="dailyAllDone" data-i18n="daily_all_done" hidden></div>
    <div class="weekly">
      <div class="weekly-head">
        <span class="weekly-title" data-i18n="weekly_title">Weekly reward</span>
        <span class="weekly-count" id="weeklyCount"></span>
      </div>
      <div class="weekly-dots" id="weeklyDots"></div>
      <div class="weekly-rewards" id="weeklyRewards"></div>
    </div>
    <button class="btn" id="dailyClose" data-i18n="album_close" style="width:100%;">Close</button>
  </div>
</div>

<!-- world clear reward -->
<div class="modal" id="worldOverlay">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="sticker-big" id="worldEmoji">🏅</div>
    <h3 id="worldTitle"></h3>
    <div class="album-status" id="worldSub"></div>
    <button class="btn primary" id="worldOk" data-i18n="world_ok" style="width:100%;">Continue</button>
  </div>
</div>

<!-- store -->
<div class="modal" id="store">
  <div class="backdrop" id="storeBackdrop"></div>
  <div class="sheet store-sheet">
    <h3 data-i18n="store_title">💎 Store</h3>
    <div class="store-status" id="storeStatus"></div>
    <div class="store-note" id="storeNote" hidden></div>

    <div class="prod" id="premiumCard">
      <div class="prod-top">
        <span class="prod-name" data-i18n="prod_premium">Premium</span>
        <span class="prod-price" id="premiumPrice">₩4,900</span>
      </div>
      <ul class="prod-feat">
        <li data-i18n-html="feat_unlimited"></li>
        <li data-i18n-html="feat_noads"></li>
        <li data-i18n-html="feat_theme"></li>
        <li data-i18n-html="feat_restore"></li>
      </ul>
      <button class="btn primary" id="buyPremium" data-i18n="buy" style="width:100%;">Buy</button>
      <div class="proto-tag" data-i18n="proto_tag"></div>
    </div>

    <div class="prod owned" id="premiumOwned" hidden>
      <div class="prod-top"><span class="prod-name" data-i18n="owned">Premium active ✓</span></div>
      <div class="store-sub" data-i18n="owned_sub"></div>
    </div>

    <div class="theme-row" id="themeRow" hidden>
      <div class="theme-label" data-i18n="theme_label">Theme</div>
      <div class="theme-opts">
        <button class="theme-opt" id="themeDefault">Travel Album</button>
        <button class="theme-opt" id="themeMint">Mint</button>
        <button class="theme-opt" id="themePremium">Dusk</button>
      </div>
    </div>

    <button class="btn ghost" id="restorePurchase" data-i18n="restore" style="width:100%;margin-top:4px;">Restore purchase</button>
    <button class="btn" id="storeClose" data-i18n="store_close" style="width:100%;margin-top:8px;">Close</button>
    <div class="store-legal" data-i18n="store_legal"></div>
  </div>
</div>

<!-- rewarded ad: offer -->
<div class="modal" id="adOffer">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="sticker-big">🎬</div>
    <h3 data-i18n="ad_offer_title">Watch an ad for 1 hint</h3>
    <div class="album-status" data-i18n="ad_offer_desc"></div>
    <!-- 보상형 광고 규격: '안 보고 계속'을 '광고 보기'와 동일 크기·색·폰트로(다크패턴 금지) -->
    <div style="display:flex;gap:10px;">
      <button class="btn" id="adOfferClose" data-i18n="ad_offer_close" style="flex:1;">Close</button>
      <button class="btn" id="adWatch" data-i18n="ad_watch" style="flex:1;">Watch ad</button>
    </div>
  </div>
</div>

<!-- rewarded ad: playback (placeholder for real ad SDK) -->
<div class="modal" id="adPlay">
  <div class="backdrop"></div>
  <div class="sheet">
    <div class="ad-slot">
      <div class="ad-badge" data-i18n="ad_label">Ad</div>
      <div class="ad-ph"><span data-i18n="ad_ph">Ad area</span><br><small data-i18n="ad_ph_sub"></small></div>
    </div>
    <div class="album-status" id="adCountWrap"></div>
    <button class="btn primary" id="adReward" data-i18n="ad_reward" style="width:100%;" disabled>Get hint</button>
    <button class="btn ghost" id="adClose" data-i18n="ad_skip" style="width:100%;margin-top:8px;">Skip</button>
  </div>
</div>

<!-- backup / restore -->
<div class="modal" id="backup">
  <div class="backdrop" id="backupBackdrop"></div>
  <div class="sheet backup-sheet">
    <h3 data-i18n="backup_title">Backup &amp; Restore</h3>
    <div class="bk-label" data-i18n="backup_export_label"></div>
    <textarea id="backupCode" class="bk-area" readonly rows="3"></textarea>
    <button class="btn" id="backupCopy" data-i18n="backup_copy" style="width:100%;margin-bottom:14px;">Copy</button>
    <div class="bk-label" data-i18n="backup_import_label"></div>
    <textarea id="importCode" class="bk-area" rows="3" placeholder="SS1..."></textarea>
    <button class="btn primary" id="backupRestore" data-i18n="backup_restore" style="width:100%;">Restore</button>
    <div class="bk-status" id="backupStatus"></div>
    <button class="btn ghost" id="backupClose" data-i18n="album_close" style="width:100%;margin-top:8px;">Close</button>
  </div>
</div>

<script src="branding.js"></script>
<script src="i18n.js"></script>
<script src="platform.js"></script>
<script src="stages-data.js"></script>
<script src="game.js"></script>
</body>
</html>
